version: 2

project_name: gpm

before:
  hooks:
    - go mod tidy

builds:
  - id: gpm
    main: ./cmd/gpm
    binary: gpm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/cafecito-games/godot-package-manager/internal/cli.version={{ .Version }}

archives:
  - id: gpm
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: gpm
    repository:
      owner: cafecito-games
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/cafecito-games/godot-package-manager"
    description: "CLI addon manager for Godot projects"
    # The release binaries are not code-signed, so strip the quarantine
    # attribute on install to avoid Gatekeeper blocking the executable.
    #
    # This uses custom_block rather than hooks.post.install because GoReleaser
    # renders hook bodies inside Homebrew's deprecated `postflight` stanza,
    # which now warns on every install. custom_block emits the declarative
    # `postflight_steps` replacement directly.
    #
    # custom_block is templated exactly once, so {{staged_path}} is escaped to
    # survive that pass and reach Homebrew's step runner literally.
    custom_block: |
      postflight_steps do
        on_macos do
          if_path_exists "/usr/bin/xattr" do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/gpm"]
          end
        end
      end
